name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
        # Explicit readiness gate: this image boots a single-node replica set
        # plus the local Atlas Search process, not just a bare mongod, so it
        # can take longer than a plain `mongo` image to accept connections.
        # GitHub Actions blocks steps on a service container until this
        # reports healthy.
        #
        # --hostname localhost: mongodb-atlas-local's entrypoint uses the
        # container's own hostname to configure what its replica set
        # advertises to clients. GitHub Actions service containers don't
        # default this to something externally reachable (unlike a plain
        # `docker run -p` on a dev machine, or a docker-compose network) -
        # without it, the driver's initial connection succeeds but the
        # replica-set-discovery reconnect that follows tries to reach the
        # container's internal ID as a hostname and fails. Setting it to
        # "localhost" matches how the job actually reaches this service
        # (via the mapped port on localhost).
        options: >-
          --hostname localhost
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: pytest tests/unit -v
      - name: Integration tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        # test_agent_graph.py is excluded here: it asks the live agent a real
        # question and asserts on a real answer ("120,636"), which requires
        # the full 346,018-row dataset to be pre-seeded. CI's Mongo service
        # container starts completely empty every run (the source CSV isn't
        # in the repo, and running the full ingestion in CI would be slow
        # and add a large file to the repo for no real benefit) - the agent
        # correctly and honestly reports it can't find the data rather than
        # hallucinating an answer, which is exactly the behavior it should
        # have, but means this specific test can't pass here. It remains a
        # real, valuable local/manual integration test against a properly
        # seeded environment (dev machine or a seeded live deployment).
        run: pytest tests/integration -v --ignore=tests/integration/test_agent_graph.py
