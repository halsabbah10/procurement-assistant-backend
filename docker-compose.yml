services:
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      # mongodb-atlas-local writes its replica-set keyfile under /data/configdb;
      # without persisting it too, a normal `down` + `up` on the retained
      # mongodb_data volume crashes on boot ("Unable to acquire security
      # key[s]") since the persisted /data/db then expects keyfile auth that
      # no longer exists anywhere. Verified reproducible without this line.
      - mongodb_configdb:/data/configdb

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: procurement
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      ALLOWED_ORIGINS: http://localhost:5173
      ENVIRONMENT: development
    depends_on:
      - mongodb
    volumes:
      - .:/app

volumes:
  mongodb_data:
  mongodb_configdb:
